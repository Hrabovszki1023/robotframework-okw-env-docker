[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-okw-env-docker"
version = "0.1.2"
description = "Robot Framework library providing OKW environment provisioning with Docker."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Zoltan Hrabovszki", email = "hrabovszki@googlemail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
keywords = ["robotframework", "docker", "testing", "okw", "environment"]
dependencies = [
  "robotframework>=6.0",
  "robotframework-okw-env>=0.1.0",
  "docker>=7.0.0",
  "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/Hrabovszki1023/robotframework-okw-env-docker"
Repository = "https://github.com/Hrabovszki1023/robotframework-okw-env-docker"
Documentation = "https://hrabovszki1023.github.io/robotframework-okw-env-docker/"

[project.entry-points."okw_env.providers"]
docker = "okw_env_docker:DockerProvider"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
